name: probe-std
on:
  push:
    branches: [claude/sleepy-wright-r04avo]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: |
          LIB=$(dirname $(which zig))/lib; cd "$LIB/std"
          p() { echo "### $1:$2"; sed -n "$2p" "$1" | grep -vE '^\s*///?' ; }
          p Io.zig 721,800
          p Io.zig 890,905
          p Io.zig 1132,1175
          echo "### Terminate"; grep -rn "fn TerminateProcess\|fn NtTerminateProcess" os/ | head
          echo "### linux SIG"; grep -n "pub const SIG = \|KILL" os/linux.zig | head -5
          echo "### File.Reader"; grep -nE 'pub (fn|const) ' Io/File/Reader.zig | head -30
          echo "### hashmaps"; grep -nE 'pub fn StringArrayHashMapUnmanaged|pub const StringArrayHashMapUnmanaged|pub fn StringArrayHashMap\b' array_hash_map.zig std.zig | head
          echo "### std.zig"; grep -nE 'pub const (ArrayList|StringArrayHashMap|Thread|fs|time|crypto|debug)' std.zig
          echo "### debug print"; grep -nE 'pub fn print' debug.zig
          echo "### SpawnConfig"; p Thread.zig 298,352
          true
