name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test --summary all
      - run: bash test/integration.sh
        shell: bash
      - name: Launcher smoke test (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          zig build fake
          $root = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\lroot").FullName
          $job = Start-Job {
            param($s, $c, $r)
            & $s -NoTunnel -Port 18766 -Claude $c -Root $r
          } -ArgumentList "$PWD\scripts\start.ps1", "$PWD\zig-out\bin\fake_claude.exe", $root
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:18766/healthz).StatusCode -eq 200 } catch {}
          }
          Receive-Job $job
          if (-not $ok) { throw "launcher did not start the server" }
          $tok = (Get-Content -Raw "$env:USERPROFILE\.claudegpt\token").Trim()
          $body = '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
          $r = Invoke-RestMethod -Method Post -Uri http://127.0.0.1:18766/mcp -Headers @{ Authorization = "Bearer $tok" } -ContentType application/json -Body $body
          if ($r.result.tools.Count -ne 6) { throw "unexpected tools/list: $($r | ConvertTo-Json -Depth 5)" }
          Stop-Job $job
          Write-Host "launcher: PASS"

  windows-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@v4
        with:
          name: claudegpt-windows-x86_64
          path: zig-out/bin/claudegpt.exe
