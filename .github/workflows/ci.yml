name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build test --summary all
      - run: bash test/integration.sh
        shell: bash

  windows-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig build -Dtarget=x86_64-windows -Doptimize=ReleaseSafe
      - uses: actions/upload-artifact@v4
        with:
          name: claudegpt-windows-x86_64
          path: zig-out/bin/claudegpt.exe
